name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - ".claude/**"
      - "assets/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (auto takes it from the branch name of the merged pull request)
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch
      notes:
        description: Release notes (empty takes the title of the merged pull request)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.current-v-version }}
      changelog: ${{ steps.pull-request.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Find the merged pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          INCREMENT_OVERRIDE: ${{ inputs.increment }}
          NOTES_OVERRIDE: ${{ inputs.notes }}
        run: |
          pull_request=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}')
          title=$(jq -r '.title // empty' <<< "$pull_request")
          branch=$(jq -r '.head.ref // empty' <<< "$pull_request")
          if [ -z "$title" ]; then
            title=$(git log -1 --format=%s)
          fi
          case "$branch" in
            breaking/*) increment="major" ;;
            feature/*) increment="minor" ;;
            *) increment="patch" ;;
          esac
          if [ -n "$INCREMENT_OVERRIDE" ] && [ "$INCREMENT_OVERRIDE" != "auto" ]; then
            increment="$INCREMENT_OVERRIDE"
          fi
          if [ -n "$NOTES_OVERRIDE" ]; then
            title="$NOTES_OVERRIDE"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "increment=$increment" >> "$GITHUB_OUTPUT"
          echo "Branch '$branch' gives a $increment version." >> "$GITHUB_STEP_SUMMARY"
      - name: Calculate the next version
        id: next
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: ${{ steps.pull-request.outputs.increment }}
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.version }}
          TITLE: ${{ steps.pull-request.outputs.title }}
        run: |
          echo "Version $VERSION: $TITLE" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  publish:
    name: Build and release
    needs: [version, checks]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the app with the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./build.sh
      - name: Zip the app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ditto -c -k --keepParent "RexJump for VibeIsland.app" "RexJump-for-VibeIsland-$VERSION.zip"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
        run: |
          options=(--target "$GITHUB_SHA" --title "v$VERSION" --notes "$CHANGELOG")
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIOUS_TAG" > /dev/null 2>&1; then
            options+=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "v$VERSION" "RexJump-for-VibeIsland-$VERSION.zip" vibe-island/rex.json "${options[@]}"
          echo "Version $VERSION released" >> "$GITHUB_STEP_SUMMARY"
