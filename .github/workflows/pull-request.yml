name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(breaking|feature|fix)/.+ && ! "$BRANCH" =~ ^dependabot/.+ ]]; then
            echo "The branch name '$BRANCH' must start with breaking/, feature/ or fix/ (the release pipeline derives the version from it)." >&2
            exit 1
          fi
          case "$BRANCH" in
            breaking/*) echo "This pull request gives a major version." >> "$GITHUB_STEP_SUMMARY" ;;
            feature/*) echo "This pull request gives a minor version." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "This pull request gives a patch version." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
